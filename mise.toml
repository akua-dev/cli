[tools]
bun = "1.3.7"


[tasks.dev]
description = "Run the TypeScript CLI entrypoint"
run = "bun run dev --"

[tasks.build]
description = "Typecheck and build JavaScript output"
run = "bun run build"

[tasks."build:binary"]
description = "Compile a self-contained akua executable with Bun"
run = "bun run build:binary"

[tasks."release:package"]
description = "Build and verify every self-contained release archive"
run = "bun run release:package"

[tasks."release:verify"]
description = "Verify release manifests, archives, and checksums"
run = "bun run release:verify"

[tasks."release:smoke"]
description = "Verify and smoke this host archive (requires CLI_RELEASE_ARCHIVE_SHA256)"
run = "bun run release:smoke"

[tasks.test]
description = "Run tests"
run = "bun run test"


[tasks.generate]
description = "Regenerate generated CLI artifacts from cnap docs/openapi-public.json (via Bazel)"
run = "bazel run //tools/cli:write_generated"

[tasks."generate:check"]
description = "Verify generated CLI artifacts match Bazel output (sdk_generated_drift_test)"
run = "bazel test //:sdk_generated_drift_test"

[tasks.check]
description = "Run the local validation suite"
depends = ["generate:check", "build", "test"]
